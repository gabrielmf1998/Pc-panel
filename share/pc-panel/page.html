<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Panel</title>
<link rel="icon" id="icone" href="data:,">
<style>
:root{color-scheme:dark;--plano:#0d0d0d;--sup:#1a1a19;--sup2:#262624;--tinta:#f0efec;--tinta2:#c3c2b7;
  --apagado:#898781;--grade:#2c2c2a;--eixo:#383835;--borda:rgba(255,255,255,.10);
  --s1:#3987e5;--s2:#d95926;--bom:#2fbf4a;--aviso:#f5bd3a;--serio:#f08a5d;--critico:#ef5a5a;--lin:1.64rem;--topo-h:46px;
  --m-ram:#9085e9;--m-vram:#c06bd6;--m-gpu:#25afc2;--m-cpu:#3987e5;--m-fps:#b5bfd0}
body[data-tema="preto"]{--plano:#000;--sup:#0b0b0b;--sup2:#1a1a19;--grade:#222220;--borda:rgba(255,255,255,.14)}
body[data-tema="noite"]{--plano:#090e1a;--sup:#111a2c;--sup2:#1b2740;--grade:#1f2b45;--eixo:#2f3d5e;--tinta2:#c2c9d8;--apagado:#8490a8}
body[data-tema="contraste"]{--plano:#000;--sup:#000;--sup2:#1a1a19;--tinta:#fff;--tinta2:#fff;--apagado:#c3c2b7;
  --grade:#52514e;--eixo:#898781;--borda:rgba(255,255,255,.6);--s1:#6da7ec;
  --bom:#3ddc4a;--aviso:#ffd23f;--serio:#ff9a3c;--critico:#ff5c5c}
body[data-tema="claro"]{color-scheme:light;--plano:#f0efec;--sup:#fcfcfb;--sup2:#f0efec;--tinta:#0b0b0b;--tinta2:#52514e;
  --apagado:#898781;--grade:#e1e0d9;--eixo:#c3c2b7;--borda:rgba(11,11,11,.12);--s1:#2a78d6;--s2:#eb6834;
  --bom:#14801a;--aviso:#a35f00;--serio:#c2410c;--critico:#b42318;
  --m-ram:#6250d6;--m-vram:#9b3fb8;--m-gpu:#0e7f91;--m-cpu:#2a78d6;--m-fps:#5a6578}
body[data-cor="agua"]{--s1:#199e70}body[data-cor="violeta"]{--s1:#9085e9}body[data-cor="magenta"]{--s1:#d55181}
body[data-tema="claro"][data-cor="agua"]{--s1:#1baf7a}body[data-tema="claro"][data-cor="violeta"]{--s1:#6250d6}
body[data-tema="claro"][data-cor="magenta"]{--s1:#e87ba4}
*{box-sizing:border-box}
html{font-size:14px}
html,body{margin:0}
body{background:var(--plano);color:var(--tinta);font:1rem/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow-x:hidden;overflow-y:auto}
button,input,select{font:inherit}
button{color:var(--tinta2);background:var(--sup);border:1px solid var(--borda);border-radius:7px;padding:5px 12px;cursor:pointer;white-space:nowrap}
button:hover,button:focus-visible{background:var(--sup2);color:var(--tinta)}
button.principal{background:var(--s1);border-color:transparent;color:#fff;font-weight:600}
button.principal:hover{filter:brightness(1.12);background:var(--s1);color:#fff}

.topo{min-height:46px;display:flex;align-items:center;gap:12px;min-width:0;padding:10px 14px 0}
.hora{font-size:1.57rem;font-weight:600;font-variant-numeric:tabular-nums}
.data{color:var(--apagado);white-space:nowrap}
.geral{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border-color:transparent;padding:5px 10px;text-align:left}
#geral-tx{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--tinta2)}
.geral.al-aviso,.geral.al-serio,.geral.al-critico{background:color-mix(in srgb,var(--al) 16%,var(--sup));border-color:var(--al);font-size:1.14rem}
.geral.al-aviso #geral-tx,.geral.al-serio #geral-tx,.geral.al-critico #geral-tx{color:var(--tinta);font-weight:600}
.al-aviso{--al:var(--aviso)}.al-serio{--al:var(--serio)}.al-critico{--al:var(--critico)}
.topo nav{display:flex;gap:8px}
.chip{font-size:.86rem;padding:3px 9px;border-radius:999px}
#mods{display:flex;gap:6px;min-width:0;overflow:hidden}
.mod{font-size:.82rem;color:var(--apagado);border:1px solid var(--borda);border-radius:999px;padding:2px 9px;white-space:nowrap}
.mod b{font-weight:500;color:var(--tinta2)}
body[data-estreito] #mods{display:none}
@media (max-width:1180px){#mods,.data{display:none}}
[hidden]{display:none!important}

.app{display:grid;gap:10px;padding:10px 12px 12px;height:calc(100vh - var(--topo-h))}
body.rolar .app{height:auto;min-height:calc(100vh - var(--topo-h))}
.cartao{background:var(--sup);border:1px solid var(--borda);border-radius:10px;padding:11px 14px 12px;
  min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden;container-type:size;transition:opacity .3s}
.cartao.fora{display:none}
body.semdados .cartao{opacity:.45}
.cartao.al-aviso,.cartao.al-serio,.cartao.al-critico{border-color:var(--al);border-width:2px;padding:10px 13px 11px;
  background:color-mix(in srgb,var(--al) 9%,var(--sup))}
.cartao.al-serio,.cartao.al-critico{background:color-mix(in srgb,var(--al) 15%,var(--sup))}
.cartao.al-aviso>header .pilula,.cartao.al-serio>header .pilula,.cartao.al-critico>header .pilula{background:var(--al);color:#141414;
  padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.cartao.al-aviso>header .pilula i,.cartao.al-serio>header .pilula i,.cartao.al-critico>header .pilula i{color:inherit}
.cartao.al-aviso>header h2::before,.cartao.al-serio>header h2::before,.cartao.al-critico>header h2::before,
#c-jogo.al-aviso .l1 h2::before,#c-jogo.al-serio .l1 h2::before,#c-jogo.al-critico .l1 h2::before{background:var(--al)}
.cartao.al-critico{position:relative}
.cartao.al-critico::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;will-change:opacity;
  box-shadow:inset 0 0 22px color-mix(in srgb,var(--critico) 45%,transparent);animation:pulso 1.6s ease-in-out infinite alternate}
@keyframes pulso{from{opacity:.15}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.cartao.al-critico::after{animation:none;opacity:.7}}
#c-chat{padding:0}
#c-ram{--mc:var(--m-ram)}#c-vram{--mc:var(--m-vram)}#c-gpu{--mc:var(--m-gpu)}#c-cpu{--mc:var(--m-cpu)}#c-rede{--mc:var(--s1)}#c-jogo{--mc:var(--m-fps)}#c-bat{--mc:var(--m-fps)}
.cartao[data-acento]>header h2::before,#c-jogo .l1 h2::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;
  background:var(--mc);margin-right:7px;vertical-align:1px}
.num b{transition:color .4s}
.num b.nv-aviso{color:var(--aviso)}.num b.nv-serio{color:var(--serio)}.num b.nv-critico{color:var(--critico)}

.cartao>header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:18px;flex:none}
h2{margin:0;font-size:.93rem;font-weight:500;color:var(--tinta2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2 small,h3 small{color:var(--apagado);font-size:.86rem;font-weight:400;margin-left:6px}
h3{margin:0;font-size:.86rem;font-weight:500;color:var(--apagado);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pilula{display:inline-flex;align-items:center;gap:5px;font-size:.86rem;color:var(--tinta2);white-space:nowrap}
.pilula i,.g{font-style:normal;font-size:.71rem}
.bom{color:var(--bom)}.aviso{color:var(--aviso)}.serio{color:var(--serio)}.critico{color:var(--critico)}
.elo{background:none;border:0;padding:0;color:var(--apagado);font-size:.86rem;text-decoration:underline;text-underline-offset:2px}
.elo:hover{background:none;color:var(--tinta)}

.resumo{display:flex;align-items:baseline;gap:18px;flex:none;min-width:0}
.num{display:flex;align-items:baseline;gap:6px;white-space:nowrap;flex:none}
.num b{font-size:2.43rem;line-height:1;font-weight:600;letter-spacing:-.01em}
.num span{color:var(--tinta2)}
.sub{flex:1;min-width:0;display:flex;gap:2px 16px;flex-wrap:wrap;margin:0;max-height:1.36rem;overflow:hidden}
.sub div{display:flex;gap:5px;align-items:baseline;white-space:nowrap}
.sub dt{color:var(--apagado);font-size:.86rem}
.sub dd{margin:0;font-variant-numeric:tabular-nums}
@container (min-height:21.4rem){.sub{max-height:2.9rem}}
#c-jogo .sub{max-height:2.9rem}

.graf{flex:1 1 0;min-height:0;min-width:0;position:relative}
.graf svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.grade{stroke:var(--grade);stroke-width:1}.eixo{stroke:var(--eixo);stroke-width:1}
.rot{fill:var(--apagado);font-size:.75rem;font-variant-numeric:tabular-nums}
.limite{stroke:var(--critico);stroke-width:1;stroke-dasharray:4 4;opacity:.8}
.zona{fill:var(--critico);opacity:.08}
.pico{fill:var(--tinta2);font-size:.75rem;font-variant-numeric:tabular-nums}
.mira{stroke:var(--apagado);stroke-width:1}
.linha{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dica{position:absolute;top:2px;pointer-events:none;background:var(--sup2);border:1px solid var(--borda);
  border-radius:7px;padding:6px 9px;font-size:.86rem;white-space:nowrap;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.dica .h{color:var(--apagado);margin-bottom:2px;font-variant-numeric:tabular-nums}
.dica .r{display:flex;align-items:center;gap:6px}
.dica .r i{width:10px;height:2px;border-radius:1px}
.dica .r b{font-weight:600;font-variant-numeric:tabular-nums}
.dica .r span{color:var(--tinta2)}
.legenda{display:flex;gap:14px;font-size:.86rem;color:var(--tinta2);white-space:nowrap}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:2px;border-radius:1px}
.legenda b{font-weight:500;color:var(--tinta);font-variant-numeric:tabular-nums}
.redegraf{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:8px}
.redegraf>div{flex:1 1 0;min-height:0;min-width:0;display:flex;flex-direction:column;gap:3px}
@container (max-height:21.4rem){.redegraf{flex-direction:row;gap:12px}.legenda b{display:none}}

.nucleos{display:flex;gap:2px;height:2rem;align-items:flex-end;border-bottom:1px solid var(--eixo);flex:none}
.nucleos i{flex:1 1 0;max-width:24px;background:var(--s1);border-radius:4px 4px 0 0;min-height:1px}
.med{height:6px;border-radius:3px;background:color-mix(in srgb,var(--c,var(--s1)) 24%,transparent);overflow:hidden;flex:none}
.med i{display:block;height:100%;background:var(--c,var(--s1));border-radius:3px;transition:width .5s}
.fino{height:4px}
@container (max-height:14.3rem){.nucleos{display:none}}
@container (max-height:9.2rem){.graf,.redegraf{display:none}.resumo{flex-direction:column;gap:4px}.sub div:not(:first-child){display:none}}
@container (max-height:6.7rem){.fino{display:none}}

.duas{flex:1 1 0;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
@container (max-width:720px){.duas{gap:14px}.duas .lin{grid-template-columns:minmax(0,1fr) auto}.duas .barra{display:none}}
@container (max-width:400px){.duas{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr));gap:8px}}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;gap:4px}
.lista{flex:1 1 0;min-height:0;overflow:hidden}
.lin{display:grid;grid-template-columns:minmax(0,40%) minmax(10px,1fr) 4.6rem;align-items:center;gap:8px;height:var(--lin)}
.lin .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lin .n small{color:var(--apagado);font-size:.82rem}
.lin .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lin.t2{grid-template-columns:minmax(0,38%) minmax(10px,1fr) 5.2rem}
.lin.t3{grid-template-columns:minmax(0,36%) minmax(10px,1fr) 4.4rem 3.6rem}
.lin .mx{color:var(--apagado);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@container (max-width:330px){.lin.t3{grid-template-columns:minmax(0,1fr) 4.4rem 3.6rem}.lin.t3 .med{display:none}}
.lin.s{grid-template-columns:minmax(0,1fr) auto}
.barra{height:6px}
.barra i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.vazio{color:var(--apagado);font-size:.89rem;padding-top:2px}

.disco{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:2px 0 4px}
.disco .med{height:4px}
.disco .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.disco .det{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:0 12px;max-height:1.25rem;overflow:hidden;color:var(--apagado);
  font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.disco .det b{font-weight:500;color:var(--tinta2)}
.disco .det .aviso b,.disco .det .serio b,.disco .det .critico b{color:inherit}
.disco .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.disco .med{grid-column:1/-1}
.disco .io{grid-column:1/-1;color:var(--apagado);font-size:.86rem;display:flex;gap:12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
@container (max-height:8.5rem){.disco .det{display:none}}

.mini{padding:6px 14px;gap:1px;justify-content:center}
.mini.al-aviso,.mini.al-serio,.mini.al-critico{padding:5px 13px}
.mini .l1{display:flex;align-items:baseline;gap:10px;min-width:0}
.mini h2{flex:none;font-size:.86rem;color:var(--apagado)}
.mini .p{font-size:1.07rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .d{font-size:.89rem;color:var(--tinta2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2rem}
@container (max-height:3.2rem){.mini .d{display:none}}
.mini .d2{display:none;font-size:.86rem;color:var(--apagado);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container (min-height:4.6rem){.mini .d2{display:block}}
#c-jogo .full{display:none}
#c-jogo.grande{justify-content:flex-start;padding:11px 14px 12px;gap:6px}
#c-jogo.grande .full{display:flex;flex-direction:column;gap:6px;flex:1 1 0;min-height:0}
#c-jogo.grande .l1 h2{font-size:.93rem;color:var(--tinta2);font-weight:500}
#c-jogo.grande .p{font-size:.93rem;font-weight:600;color:var(--tinta)}
#c-jogo.grande .d,#c-jogo.grande .d2{display:none}
.bat-info{font-size:.86rem;color:var(--tinta2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;margin-top:7px}
@container (max-height:9.2rem){.bat-info{display:none}}
#c-jogo .full .info{font-size:.86rem;color:var(--tinta2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
#c-jogo .full .info2{font-size:.86rem;color:var(--apagado);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
#c-jogo .full .dica-fps{font-size:.86rem;color:var(--apagado);flex:none}
@container (max-height:12rem){#c-jogo .full .info2{display:none}}
@container (max-height:9.5rem){#c-jogo .full .fpsgraf{display:none}}
.fpsgraf{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:8px}
.fpsgraf>div{flex:1 1 0;min-height:0;min-width:0;display:flex;flex-direction:column;gap:2px}
@container (max-height:24rem){.fpsgraf{flex-direction:row;gap:12px}}
#c-jogo .full .garg{font-size:.89rem;color:var(--tinta2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
#c-jogo .full .garg b{color:var(--tinta);font-weight:600}
.fpsv{font-variant-numeric:tabular-nums}
/* events: the last 24 h as a strip under the list */
#c-eventos .lista{flex:1 1 0}
.tl{flex:none;display:flex;flex-direction:column;gap:3px}
.tl .r{font-size:.82rem;color:var(--apagado);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .r b{font-weight:500;color:var(--tinta2)}
.tl svg{display:block;width:100%;height:52px}
.tl .tt{fill:none;stroke:var(--m-cpu);stroke-width:1.5;stroke-linejoin:round}
.tl .faixa{fill:var(--m-fps);opacity:.35}
.tl .fundo{fill:var(--sup2)}
@container (max-height:9rem){.tl{display:none}}
.abas{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.abas button[aria-pressed="true"]{background:var(--sup2);color:var(--tinta);border-color:var(--s1)}
.g24{position:relative;height:280px;width:min(940px,88vw);margin-top:8px}
.g24 svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.faixa-jogo{fill:var(--tinta2);opacity:.09}
.legenda i.jg{height:10px;background:var(--tinta2);opacity:.25}
.botoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.botoes button{padding:3px 10px;font-size:.89rem}
.botoes button[aria-pressed="true"]{background:var(--sup2);color:var(--tinta);border-color:var(--s1)}
td button{padding:1px 8px;font-size:.86rem}
#cx-resumo{max-width:940px;margin-bottom:10px;color:var(--tinta2)}
#cx-rel{max-width:940px;margin:0 0 10px;padding-left:20px;color:var(--tinta)}
#cx-rel li{margin:2px 0}
#cx-rel li:first-child{list-style:none;margin-left:-20px;color:var(--tinta2)}
.rd-aviso{font-size:.86rem;color:var(--tinta2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.hd-dir{display:inline-flex;align-items:center;gap:12px}
dialog.tela{width:min(1560px,96vw);height:min(960px,94vh);max-height:94vh;flex-direction:column}
dialog.tela[open]{display:flex}
.rd-diag{display:flex;gap:8px;align-items:baseline;margin:-4px 0 12px;color:var(--tinta)}
.rd-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px;flex:none}
.rd-tile{background:var(--sup2);border:1px solid var(--borda);border-radius:10px;padding:8px 12px;min-width:0}
.rd-tile .k{font-size:.86rem;color:var(--tinta2);white-space:nowrap}
.rd-tile .v{font-size:1.55rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rd-tile small{display:block;color:var(--apagado);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-tile.aviso{border-color:var(--aviso)}.rd-tile.serio{border-color:var(--serio)}.rd-tile.critico{border-color:var(--critico)}
.rd-grade{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(180px,1fr) auto;gap:12px}
.rd-b{border:1px solid var(--borda);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0;overflow:auto}
.rd-b .graf{min-height:150px}
.rd-gp{grid-column:span 2}
.rd-b table{width:100%}
.rd-b th,.rd-b td{padding:3px 8px}
.rd-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:.93rem}
.rd-dl dt{color:var(--tinta2);white-space:nowrap}
.rd-dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1000px),(max-height:700px){dialog.tela{height:auto}.rd-grade{flex:none;grid-template-columns:minmax(0,1fr);grid-template-rows:none}.rd-gp{grid-column:auto}.rd-b{overflow:visible}.rd-b .graf{min-height:170px}}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;height:var(--lin)}
.ev .q,.ev .dur{color:var(--apagado);font-size:.86rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#c-chat iframe{flex:1;border:0;width:100%;border-radius:10px;background:var(--sup)}

dialog{background:var(--sup);color:var(--tinta);border:1px solid var(--borda);border-radius:12px;padding:16px 18px;
  width:min(680px,94vw);max-height:92vh;overflow:auto}
dialog.largo{width:auto;max-width:94vw}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog>header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:12px}
dialog h2{font-size:1.14rem;font-weight:600;color:var(--tinta)}
fieldset{border:1px solid var(--borda);border-radius:9px;margin:0 0 12px;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{color:var(--tinta2);font-size:.93rem;padding:0 6px}
legend span{color:var(--apagado);margin-left:8px;font-variant-numeric:tabular-nums}
label{display:flex;align-items:center;gap:8px;color:var(--tinta2);flex-wrap:wrap}
label.campo{justify-content:space-between;flex-wrap:nowrap}
input[type=text],input[type=number],select{background:var(--plano);color:var(--tinta);border:1px solid var(--borda);border-radius:7px;padding:5px 9px;min-width:0}
input[type=text]{flex:1;max-width:400px}
input.curto{width:4.8rem;padding:4px 6px;text-align:right}
#lim-tab td,#lim-tab th{padding:3px 6px}#lim-tab td:first-child,#lim-tab th:first-child{text-align:left;white-space:normal;min-width:11rem}
#lim-tab input[type=number]{width:4.6rem;padding:3px 5px;text-align:right}#lim-tab input:disabled{opacity:.6}
input[type=range]{flex:1;accent-color:var(--s1);min-width:90px}
input[type=checkbox],input[type=radio]{accent-color:var(--s1);width:16px;height:16px;flex:none;margin:0}
.marcas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 14px}
.dois{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px 18px}
.nota{color:var(--apagado);font-size:.89rem;margin:0}
.erro{color:var(--tinta);font-size:.93rem;margin:0 0 10px}
.erro:empty{display:none}
dialog footer{display:flex;justify-content:space-between;align-items:center;gap:14px}
.rolagem{overflow:auto;max-height:70vh}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.93rem}
th,td{padding:4px 12px;text-align:right;border-bottom:1px solid var(--grade);white-space:nowrap}
th{color:var(--apagado);font-weight:500;position:sticky;top:0;background:var(--sup)}
td.e,th.e{text-align:left}
.curva{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:6px 14px;align-items:start;padding-left:24px}
.curva .prontas{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.curva .prontas button{padding:3px 10px;font-size:.89rem}
.curva .pontos{display:flex;flex-direction:column;gap:5px}
.previa{width:270px;height:124px;background:var(--plano);border-radius:8px;border:1px solid var(--borda)}
@media (max-width:640px){.curva{grid-template-columns:minmax(0,1fr)}}
.sens{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 22px}
.sens h3{margin-bottom:4px;color:var(--tinta2)}
.sens div div{display:flex;justify-content:space-between;gap:10px;font-size:.93rem;padding:1px 0}
.sens div div span:last-child{font-variant-numeric:tabular-nums;color:var(--tinta)}
.sens div div span:first-child{color:var(--apagado);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

body[data-cols="2"]{--lin:1.43rem}
body[data-cols="2"] .num b{font-size:2.14rem}
body[data-estreito] .app{gap:8px;padding:8px}
body[data-estreito] .cartao{padding:7px 12px;gap:4px}
body[data-estreito] .num b{font-size:1.86rem}
body[data-estreito] .data,body[data-estreito] nav .so-grande{display:none}
body[data-estreito] .topo{padding:8px 10px 0;gap:8px;min-height:40px}
body[data-estreito] .hora{font-size:1.29rem}
@media (max-width:900px){#btn-rede{display:none}.topo .data{display:none}}   /* the Network card's "details" link opens it there */
</style>
</head>
<body data-tema="escuro" data-cor="azul" data-cols="4">
<header class="topo" id="topo">
  <span class="hora" id="hora"></span>
  <span class="data" id="data"></span>
  <button type="button" class="geral" id="btn-ev" data-it="geral_t">
    <span class="pilula" id="geral-st"></span><span id="geral-tx" data-i="conectando"></span></button>
  <button type="button" class="chip" id="btn-mudo" hidden></button>
  <button type="button" class="chip" id="btn-ocultos" hidden></button>
  <span id="mods"></span>
  <nav>
    <button type="button" id="btn-rede" class="so-grande" data-i="b_rede"></button>
    <button type="button" id="btn-fans" class="so-grande" data-i="b_fans"></button>
    <button type="button" id="btn-sens" class="so-grande" data-i="b_sens"></button>
    <button type="button" id="btn-tab" class="so-grande" data-i="b_hist"></button>
    <button type="button" id="btn-aj" data-i="b_aj"></button>
  </nav>
</header>

<main class="app" id="app">
  <section class="cartao" id="c-ram" data-acento>
    <header><h2 data-i="c_ram"></h2><span class="pilula" id="ram-st"></span></header>
    <div class="resumo">
      <div class="num"><b id="ram-v">0</b><span id="ram-de">GiB</span></div>
      <dl class="sub">
        <div data-it="left_t"><dt id="ram-left-r"></dt><dd id="ram-left"></dd></div>
        <div><dt>Swap</dt><dd id="ram-swap"></dd></div>
        <div><dt>Cache</dt><dd id="ram-cache"></dd></div>
        <div data-it="psi_ram_t"><dt data-i="pressao"></dt><dd id="ram-psi"></dd></div>
      </dl>
    </div>
    <div class="med fino" id="ram-m"><i></i></div>
    <div class="graf" id="g-ram"></div>
  </section>

  <section class="cartao" id="c-vram" data-acento>
    <header><h2><span id="vram-tit">VRAM</span><small id="gpu-nome"></small></h2><span class="pilula" id="vram-st"></span></header>
    <div class="resumo">
      <div class="num"><b id="vram-v">0</b><span id="vram-de">GiB</span></div>
      <dl class="sub">
        <div><dt data-i="livre"></dt><dd id="vram-livre"></dd></div>
        <div><dt data-i="maior"></dt><dd id="vram-top"></dd></div>
      </dl>
    </div>
    <div class="med fino" id="vram-m"><i></i></div>
    <div class="graf" id="g-vram"></div>
  </section>

  <section class="cartao" id="c-gpu" data-acento>
    <header><h2 data-i="c_gpu"></h2><span class="pilula" id="gpu-st"></span></header>
    <div class="resumo">
      <div class="num"><b id="gpu-v">0</b><span data-i="uso_pct"></span></div>
      <dl class="sub">
        <div><dt data-i="temperatura"></dt><dd id="gpu-temp"></dd></div>
        <div><dt data-i="consumo"></dt><dd id="gpu-w"></dd></div>
        <div><dt>Fan</dt><dd id="gpu-fan"></dd></div>
        <div><dt>Clock</dt><dd id="gpu-mhz"></dd></div>
        <div id="gpu-enc-b" data-it="enc_t"><dt id="gpu-enc-r">Encoder</dt><dd id="gpu-enc"></dd></div>
      </dl>
    </div>
    <div class="med fino" id="gpu-m"><i></i></div>
    <div class="graf" id="g-gpu"></div>
  </section>

  <section class="cartao" id="c-cpu" data-acento>
    <header><h2><span data-i="c_cpu"></span><small id="cpu-nome"></small></h2><span class="pilula" id="cpu-st"></span></header>
    <div class="resumo">
      <div class="num"><b id="cpu-v">0</b><span data-i="uso_pct"></span></div>
      <dl class="sub">
        <div><dt data-i="temperatura"></dt><dd id="cpu-temp"></dd></div>
        <div><dt>Clock</dt><dd id="cpu-ghz"></dd></div>
        <div data-it="carga_t"><dt data-i="carga"></dt><dd id="cpu-carga"></dd></div>
        <div data-it="psi_cpu_t"><dt data-i="pressao"></dt><dd id="cpu-psi"></dd></div>
      </dl>
    </div>
    <div class="med fino" id="cpu-m"><i></i></div>
    <div class="nucleos" id="cpu-nuc" role="img"></div>
    <div class="graf" id="g-cpu"></div>
  </section>

  <section class="cartao" id="c-rede" data-acento>
    <header><h2><span data-i="c_rede"></span><small id="rede-if"></small></h2><span class="hd-dir"><button type="button" class="elo" id="btn-rede2" data-i="rd_mais"></button><span class="pilula" id="rede-st"></span></span></header>
    <div class="resumo">
      <div class="num"><b id="ping-v">0</b><span data-i="ms_ping"></span></div>
      <dl class="sub">
        <div><dt data-i="perda"></dt><dd id="ping-perda"></dd></div>
        <div><dt data-i="roteador"></dt><dd id="ping-gw"></dd></div>
        <div data-it="osc_t"><dt data-i="oscilacao"></dt><dd id="ping-jit"></dd></div>
        <div><dt>Link</dt><dd id="rede-link"></dd></div>
        <div data-it="erros_t"><dt data-i="erros"></dt><dd id="rede-err"></dd></div>
      </dl>
    </div>
    <div class="rd-aviso" id="rede-diag" hidden></div>
    <div class="redegraf">
      <div><h3><span data-i="ping_net"></span><small id="ping-alvo"></small></h3><div class="graf" id="g-ping"></div></div>
      <div>
        <div class="legenda">
          <span><i style="background:var(--s1)"></i>Download <b id="net-rx"></b></span>
          <span><i style="background:var(--s2)"></i>Upload <b id="net-tx"></b></span>
        </div>
        <div class="graf" id="g-net"></div>
      </div>
    </div>
  </section>

  <section class="cartao" id="c-bat" data-acento>
    <header><h2><span data-i="c_bat"></span><small id="bat-nome"></small></h2><span class="pilula" id="bat-st"></span></header>
    <div class="resumo">
      <div class="num"><b id="bat-v">0</b><span id="bat-de">%</span></div>
      <dl class="sub">
        <div data-it="bat_eta_t"><dt id="bat-eta-r"></dt><dd id="bat-eta"></dd></div>
        <div data-it="bat_w_t"><dt id="bat-w-r"></dt><dd id="bat-w"></dd></div>
        <div id="bat-saude-b"><dt data-i="bat_saude"></dt><dd id="bat-saude"></dd></div>
      </dl>
    </div>
    <div class="med fino" id="bat-m"><i></i></div>
    <div class="bat-info" id="bat-info"></div>
    <div class="graf" id="g-bat"></div>
  </section>

  <section class="cartao" id="c-prog">
    <header><h2 data-i="c_prog"></h2></header>
    <div class="duas">
      <div class="col"><h3 data-i="p_ram"></h3><div class="lista" id="l-ram"></div></div>
      <div class="col"><h3 id="p-vram-t" data-i="p_vram"></h3><div class="lista" id="l-vram"></div></div>
      <div class="col c3"><h3 data-i="p_cpu" data-it="p_cpu_t"></h3><div class="lista" id="l-cpu"></div></div>
    </div>
  </section>

  <section class="cartao" id="c-temp">
    <header><h2 data-i="c_temp"></h2><button type="button" class="elo" id="btn-fans2" data-i="ajustar_fans"></button></header>
    <div class="lista" id="l-temp"></div>
  </section>

  <section class="cartao" id="c-disc">
    <header><h2 data-i="c_disc"></h2><span class="pilula" id="disc-psi" data-it="psi_io_t"></span></header>
    <div class="lista" id="l-disc"></div>
  </section>

  <section class="cartao" id="c-saude">
    <header><h2 data-i="c_saude"></h2><button type="button" class="elo" id="btn-upd" data-i="s_verificar"></button></header>
    <div class="lista" id="l-saude"></div>
  </section>

  <section class="cartao" id="c-eventos">
    <header><h2 data-i="c_eventos"></h2><button type="button" class="elo" id="btn-ev2" data-i="ver_todos"></button></header>
    <div class="lista" id="l-ev"></div>
    <div class="tl" id="ev-tl" hidden><div class="r" id="tl-r"></div><svg id="tl-svg" role="img"></svg></div>
  </section>

  <section class="cartao mini" id="c-jogo"><div class="l1"><h2 data-i="c_jogo"></h2><div class="p" id="jogo-p"></div></div><div class="d" id="jogo-d"></div><div class="d2" id="jogo-d2"></div>
    <div class="full">
      <div class="resumo">
        <div class="num"><b id="fps-v" class="fpsv">?</b><span>FPS</span></div>
        <dl class="sub">
          <div data-it="fps_ft_t"><dt>Frametime</dt><dd id="fps-ft"></dd></div>
          <div data-it="fps_pior_t"><dt data-i="fps_pior"></dt><dd id="fps-max"></dd></div>
          <div data-it="fps_med_t"><dt data-i="fps_med"></dt><dd id="fps-med"></dd></div>
          <div data-it="fps_low_t"><dt>1 % low</dt><dd id="fps-low"></dd></div>
        </dl>
      </div>
      <div class="dica-fps" id="fps-dica" hidden></div>
      <div class="garg" id="jogo-garg" hidden></div>
      <div class="fpsgraf" id="fps-gs">
        <div><h3>FPS</h3><div class="graf" id="g-fps"></div></div>
        <div><h3 data-i="ft_g"></h3><div class="graf" id="g-ft"></div></div>
      </div>
      <div class="info" id="jogo-info"></div>
      <div class="info2" id="jogo-info2"></div>
    </div></section>
  <section class="cartao mini" id="c-live"><div class="l1"><h2>Live</h2><div class="p" id="live-p"></div></div><div class="d" id="live-d"></div></section>
  <section class="cartao mini" id="c-pz"><div class="l1"><h2 data-i="c_pz"></h2><div class="p" id="pz-p"></div></div><div class="d" id="pz-d"></div></section>
  <section class="cartao mini" id="c-sis"><div class="l1"><h2 data-i="c_sis"></h2><div class="p" id="sis-p"></div></div><div class="d" id="sis-d"></div><div class="d2" id="sis-d2"></div></section>

  <section class="cartao fora" id="c-chat"><iframe id="chat-f" title="Chat" src="about:blank"></iframe></section>
</main>

<dialog id="tabela" class="largo">
  <header><h2 data-i="b_hist"></h2><button type="button" data-fechar data-i="fechar"></button></header>
  <div class="abas" id="h-abas"><button type="button" data-aba="10" data-i="h_a10"></button><button type="button" data-aba="24" data-i="h_a24"></button><button type="button" data-aba="ses" data-i="h_ases"></button><button type="button" data-aba="cx" data-i="h_acx"></button></div>
  <div data-painel="10"><p class="nota" data-i="h_titulo" style="margin-bottom:8px"></p><div class="rolagem"><table>
    <thead><tr><th data-i="th_hora"></th><th>RAM GiB</th><th>VRAM GiB</th><th data-i="th_gpu_p"></th><th data-i="th_cpu_p"></th><th>Ping ms</th>
      <th>Download Mbit/s</th><th>Upload Mbit/s</th><th data-i="th_cpu_t"></th><th data-i="th_gpu_t"></th></tr></thead>
    <tbody id="tab-corpo"></tbody>
  </table></div></div>
  <div data-painel="24" hidden><div class="botoes" id="h24-m"></div><p class="nota" id="h24-nota"></p><div class="g24" id="h24-g"></div></div>
  <div data-painel="ses" hidden><p class="nota" id="ses-nota" style="margin-bottom:8px"></p><div class="rolagem"><table>
    <thead><tr><th class="e" data-i="th_jogo2"></th><th data-i="th_comecou"></th><th data-i="th_durou"></th><th data-i="th_cpu_p"></th><th data-i="th_cpu_max"></th>
      <th data-i="th_gpu_p"></th><th data-i="th_gpu_max"></th><th data-i="th_w_max"></th><th data-i="th_vram_pico"></th><th data-i="th_vram_jogo"></th>
      <th data-i="th_ram_min"></th><th data-i="th_ram_jogo"></th><th data-i="th_ping_s"></th><th data-i="th_perda_s"></th><th data-i="th_jit_s"></th><th data-i="th_alertas"></th></tr></thead>
    <tbody id="ses-corpo"></tbody></table></div></div>
  <div data-painel="cx" hidden><p class="nota" id="cx-nota" style="margin-bottom:8px;max-width:940px"></p><div class="botoes" id="cx-lista"></div>
    <p class="nota" id="cx-resumo"></p><ul id="cx-rel" hidden></ul><div class="rolagem"><table><thead id="cx-cab"></thead><tbody id="cx-corpo"></tbody></table></div></div>
</dialog>

<dialog id="rede" class="tela">
  <header><h2><span data-i="rd_titulo"></span> <small class="nota" id="rd-if"></small></h2><button type="button" data-fechar data-i="fechar"></button></header>
  <div class="rd-diag" id="rd-diag"></div>
  <div class="rd-tiles" id="rd-tiles"></div>
  <div class="rd-grade">
    <section class="rd-b rd-gp"><h3 data-i="rd_g_ping"></h3>
      <div class="legenda"><span><i style="background:var(--s1)"></i><span id="rd-l-net"></span></span><span><i style="background:var(--s2)"></i><span data-i="roteador"></span></span><span><i style="background:var(--critico);width:2px;height:9px"></i><span data-i="rd_perdas"></span></span></div>
      <div class="graf" id="rd-gping"></div></section>
    <section class="rd-b"><h3 data-i="rd_g_net"></h3>
      <div class="legenda"><span><i style="background:var(--s1)"></i>Download</span><span><i style="background:var(--s2)"></i>Upload</span></div>
      <div class="graf" id="rd-gnet"></div></section>
    <section class="rd-b"><h3 data-i="rd_qual"></h3><table id="rd-qual"></table><p class="nota" data-i="rd_qual_n"></p></section>
    <section class="rd-b"><h3 data-i="rd_con"></h3><dl class="rd-dl" id="rd-con"></dl></section>
    <section class="rd-b"><h3 data-i="rd_progs"></h3><table id="rd-progs"></table><p class="nota" data-i="rd_progs_n"></p></section>
  </div>
</dialog>

<dialog id="eventos" class="largo">
  <header><h2 data-i="c_eventos"></h2><button type="button" data-fechar data-i="fechar"></button></header>
  <p class="nota" id="ev-nota" style="margin-bottom:10px"></p>
  <div class="botoes" id="ev-mudo"></div>
  <div class="rolagem"><table>
    <thead><tr><th data-i="th_comecou"></th><th data-i="th_durou"></th><th class="e" data-i="th_nivel"></th><th class="e" data-i="th_oque"></th><th class="e" data-i="th_jogo"></th><th></th></tr></thead>
    <tbody id="ev-corpo"></tbody>
  </table></div>
</dialog>

<dialog id="sensores" class="largo">
  <header><h2 data-i="sn_titulo"></h2><span><button type="button" id="sn-atualizar" data-i="atualizar"></button> <button type="button" data-fechar data-i="fechar"></button></span></header>
  <p class="nota" data-i="sn_nota" style="margin-bottom:12px;max-width:900px"></p>
  <div class="sens" id="sn-corpo" style="min-width:min(900px,88vw)"></div>
</dialog>

<dialog id="ajustes">
  <header><h2 data-i="b_aj"></h2><button type="button" data-fechar data-i="fechar"></button></header>
  <fieldset><legend data-i="a_aparencia"></legend><div class="dois">
    <label class="campo"><span data-i="a_idioma"></span><select id="aj-idioma"><option value="pt">Português</option><option value="en">English</option></select></label>
    <label class="campo"><span data-i="a_tema"></span><select id="aj-tema"><option value="escuro" data-i="tm_escuro"></option><option value="preto" data-i="tm_preto"></option><option value="noite" data-i="tm_noite"></option><option value="claro" data-i="tm_claro"></option><option value="contraste" data-i="tm_contraste"></option></select></label>
    <label class="campo"><span data-i="a_cor"></span><select id="aj-cor"><option value="azul" data-i="cr_azul"></option><option value="agua" data-i="cr_agua"></option><option value="violeta" data-i="cr_violeta"></option><option value="magenta">Magenta</option></select></label>
    <label class="campo"><span data-i="a_fonte"></span><select id="aj-fonte"><option value="1">Normal</option><option value="1.15" data-i="f_2"></option><option value="1.3" data-i="f_3"></option></select></label>
  </div></fieldset>
  <fieldset><legend data-i="a_mostrar"></legend>
    <label class="campo"><span data-i="a_perfil"></span><select id="aj-perfil"><option value="tudo" data-i="pf_tudo"></option><option value="jogo" data-i="pf_jogo"></option><option value="live" data-i="pf_live"></option><option value="hardware">Hardware</option><option value="proprio" data-i="pf_proprio"></option></select></label>
    <div class="marcas" id="aj-cartoes"></div>
    <label><input type="checkbox" id="aj-encaixe"> <span data-i="a_encaixe"></span></label>
    <p class="nota" data-i="a_mostrar_n"></p></fieldset>
  <fieldset><legend data-i="a_medicao"></legend><div class="dois">
    <label class="campo"><span data-i="a_passo"></span><select id="aj-passo"><option value="1" data-i="p_1"></option><option value="2" data-i="p_2"></option><option value="5" data-i="p_5"></option></select></label>
    <label class="campo"><span data-i="a_ping"></span><input type="text" id="aj-ping" spellcheck="false" style="max-width:150px"></label>
  </div>
    <label><input type="checkbox" id="aj-jogo-leve"> <span data-i="a_jogo_leve"></span></label>
    <label><input type="checkbox" id="aj-caixa"> <span data-i="a_caixa"></span></label>
    <label><input type="checkbox" id="aj-dica"> <span data-i="a_dica"></span></label>
    <p class="nota" data-i="a_medicao_n"></p></fieldset>
  <fieldset><legend data-i="a_avisos"></legend>
    <label><input type="checkbox" id="aj-fundo"> <span data-i="a_fundo"></span></label>

  if (f.velho) $('fa-erro').textContent = T('f_velho');
}
async function abrirFans() {
  if (!A) return;
  let d;
  try { d = await puxarCfg(); } catch (e) { return; }
  const f = A.fans;
  $('fa-dentro').hidden = !f.pode; $('fa-falta').hidden = f.pode;
  if (f.pode && d.cfg.fans) {
    const e = d.cfg.fans;
    const nvidia = A.gpu.ok && A.gpu.driver;
    blocos = {gpu: !nvidia ? null : blocoFan('gpu', T('f_gpu'), e.gpu, {min: 30, auto: true, crit: 86, temp: () => A.gpu.temp, prontas: {padrao: d.curva_gpu},
      agora: () => A.gpu.ok ? T('f_agora', A.gpu.fan + ' %') + (A.gpu.rpm.length ? ', ' + A.gpu.rpm.map(int).join(' / ') + ' rpm' : '') +
        (A.fans.alvo_gpu && e.gpu.modo === 'curva' ? ', ' + T('f_alvo', A.fans.alvo_gpu) : '') : ''}), placa: {}};
    const partes = blocos.gpu ? [blocos.gpu.el] : [];
    f.canais.forEach((c, i) => {
      if (!e.placa[c.n]) return;
      const b = blocoFan('p' + c.n, nomeFan(c.n, i), e.placa[c.n], {min: 20, crit: 90, temp: () => A.cpu.temp, prontas: d.curvas, canal: c.n,
        calib: d.cfg.calib[c.n], nome: d.cfg.nomes_fans[c.n] || '',
        agora: () => { const x = A.fans.canais.find(y => y.n === c.n); return x ? T('f_agora', int(x.rpm) + ' rpm') + (x.pct == null ? '' : ', ' + x.pct + ' %') : ''; }});
      blocos.placa[c.n] = b; partes.push(b.el);
    });
    $('fa-corpo').replaceChildren(...partes);
    $('fa-erro').textContent = '';
    fansAgora();
  }
  if (!$('fans').open) $('fans').showModal();
}
async function aplicarFans() {
  if (!blocos) return;
  const corpo = {gpu: blocos.gpu ? blocos.gpu.ler() : {modo: 'auto'}, placa: {}, nomes: {}};
  for (const n in blocos.placa) { corpo.placa[n] = blocos.placa[n].ler(); corpo.nomes[n] = blocos.placa[n].nome(); }
  try {
    const d = await pedir('/fans', corpo);
    $('fa-erro').textContent = d.erro || '';
    if (!d.erro) { A.fans.escolha = d.escolha; A.fans.aplicado = d.aplicado; CFG.nomes_fans = d.nomes; fansAgora(); }
  } catch (e) { $('fa-erro').textContent = T('f_nao_aplicou'); }
}
async function medirFans() {
  try { const d = await pedir('/fans/calibrar', {}); $('fa-erro').textContent = d.erro || ''; } catch (e) { $('fa-erro').textContent = T('f_nao_aplicou'); }
}
